<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Firebase Texting App</title>

  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // 🔴 REPLACE THIS WITH YOUR OWN FIREBASE CONFIG
    const firebaseConfig = {
      apiKey: "AIzaSyDngexzzYE5-I2hOgynJKsAqXL2PbXS5m0",
      authDomain: "chitah-52c38.firebaseapp.com",
      projectId: "chitah-52c38",
      storageBucket: "chitah-52c38.firebasestorage.app",
      messagingSenderId: "861604372314",
      appId: "1:861604372314:web:9b94665a65c1ba727e1d63"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const messagesEl = document.getElementById('messages');
    const input = document.getElementById('input');

    function addMessage(text, mine) {
      const div = document.createElement('div');
      div.className = `message ${mine ? 'me' : 'other'}`;
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    window.sendMessage = async () => {
      const text = input.value.trim();
      if (!text) return;

      await addDoc(collection(db, 'messages'), {
        text,
        createdAt: serverTimestamp()
      });

      input.value = '';
    };

    const q = query(collection(db, 'messages'), orderBy('createdAt'));
    onSnapshot(q, (snapshot) => {
      messagesEl.innerHTML = '';
      snapshot.forEach(doc => {
        addMessage(doc.data().text, false);
      });
    });
  </script>

  <style>
    body {
      margin: 0;
      background: #0f172a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui;
    }

    .phone {
      width: 390px;
      height: 670px;
      background: #f8fafc;
      border-radius: 28px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: #2563eb;
      color: white;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
    }

    main {
      flex: 1;
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .message {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 16px;
      background: #e5e7eb;
    }

    footer {
      height: 64px;
      display: flex;
      gap: 8px;
      padding: 8px;
      background: white;
    }

    input {
      flex: 1;
      border-radius: 999px;
      border: 1px solid #d1d5db;
      padding: 0 14px;
    }

    button {
      border-radius: 999px;
      border: none;
      background: #2563eb;
      color: white;
      padding: 0 16px;
    }
  </style>
</head>
<body>
  <div class="phone">
    <header>Firebase Chat</header>
    <main id="messages"></main>
    <footer>
      <input id="input" placeholder="Type a message..." />
      <button onclick="sendMessage()">Send</button>
    </footer>
  </div>
</body>
</html>
