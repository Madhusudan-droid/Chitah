<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Texting App</title>
  <style>
    :root {
      --app-width: 390px;
      --app-height: 660px;
      --primary: #2563eb;
      --bg: #f8fafc;
    }

    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      margin: 0;
      background: #0f172a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .phone {
      width: var(--app-width);
      height: var(--app-height);
      background: var(--bg);
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
    }

    header {
      height: 56px;
      background: var(--primary);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
    }

    main {
      flex: 1;
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .message {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 14px;
    }

    .me {
      align-self: flex-end;
      background: var(--primary);
      color: white;
      border-bottom-right-radius: 4px;
    }

    .other {
      align-self: flex-start;
      background: #e5e7eb;
      color: #111827;
      border-bottom-left-radius: 4px;
    }

    footer {
      height: 64px;
      display: flex;
      padding: 8px;
      gap: 8px;
      background: white;
      border-top: 1px solid #e5e7eb;
    }

    input {
      flex: 1;
      border-radius: 999px;
      border: 1px solid #d1d5db;
      padding: 0 14px;
      font-size: 14px;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 0 16px;
      background: var(--primary);
      color: white;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="phone">
    <header>Chat</header>

    <main id="messages"></main>

    <footer>
      <input id="input" placeholder="Type a message..." />
      <button onclick="sendMessage()">Send</button>
    </footer>
  </div>

  <script>
    // This lets multiple tabs/devices on the SAME site chat together
    const channel = new BroadcastChannel('simple-chat');
    const messagesEl = document.getElementById('messages');
    const input = document.getElementById('input');

    function addMessage(text, mine) {
      const div = document.createElement('div');
      div.className = `message ${mine ? 'me' : 'other'}`;
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      addMessage(text, true);
      channel.postMessage(text);
      input.value = '';
    }

    channel.onmessage = (e) => {
      addMessage(e.data, false);
    };

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendMessage();
    });
  </script>
</body>
</html>
